[package]
name = "ps5-dump-forge-server"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true

[dependencies]
blake3.workspace = true
# Roots spelled `C:\x` on Windows, as core's `list_dir` spells the folders it lists.
dunce = "1.0.5"
# The web UI is embedded gzipped (build.rs); a client that takes no gzip gets it decoded.
flate2 = "1"
getrandom.workspace = true
libc.workspace = true
# `GET /api/qr`: the page's address for a phone; no image/svg features (api.rs draws the SVG).
qrcode = { version = "0.14", default-features = false }
serde.workspace = true
serde_json.workspace = true
ps5-dump-forge-core.workspace = true
ps5-dump-forge-flink.workspace = true
# Connect's probe (`probe.rs`): an NFS NULL call, an SMB2 NEGOTIATE.
ps5-dump-forge-nfs.workspace = true
ps5-dump-forge-smb.workspace = true
# Self-update: the release's PS5 ELF downloaded over HTTPS and streamed to elfldr.
ps5-dump-forge-updater.workspace = true

# The self copy (src/self_copy.rs): only the PS5 payload unpacks it, only tests on a host.
[target.'cfg(target_env = "ps5")'.dependencies]
sha2 = "0.11"
zstd = { version = "0.13.3", default-features = false }

[dev-dependencies]
ps5upload-fpkg.workspace = true
sha2 = "0.11"
zstd = { version = "0.13.3", default-features = false }

[build-dependencies]
flate2 = "1"
sha2 = "0.11"
zstd = { version = "0.13.3", default-features = false }

[lints.rust]
# `ps5/x86_64-ps5-freebsd.json` sets `env: ps5` (ps5/README.md).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_env, values("ps5"))'] }
