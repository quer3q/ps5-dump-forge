[package]
name = "ps5-dump-forge-lz4"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true

[dependencies]
ps5upload-fpkg.workspace = true
blake3.workspace = true
crc32fast = "1.5"
sha2 = "0.11"
# Block API only: no frame format, no unsafe paths.
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
# `toml::Table` (value tree) needs the `serde` feature; we derive nothing.
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
