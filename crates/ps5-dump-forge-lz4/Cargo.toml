[package]
name = "ps5-dump-forge-lz4"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true

[dependencies]
ps5upload-fpkg.workspace = true
blake3.workspace = true
crc32fast = "1.5"
sha2 = "0.11"
# C liblz4 (block API only): the fast compressor and the HC levels.
lz4-sys = "1.11"
# The embedded runtimes are stored zstd-compressed (build.rs) and decoded on first use.
zstd = { version = "0.13.3", default-features = false }

[build-dependencies]
zstd = { version = "0.13.3", default-features = false }
