[package]
name = "ps5-dump-forge-cli"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true

[[bin]]
name = "ps5-dump-forge"
path = "src/main.rs"

[dependencies]
libc.workspace = true
serde_json.workspace = true
ps5-dump-forge-core.workspace = true
ps5-dump-forge-server.workspace = true
# `update`: the latest release asked of GitHub, the CLI downloaded and checked.
ps5-dump-forge-updater.workspace = true

[dev-dependencies]
ps5upload-fpkg.workspace = true
ps5-dump-forge-lz4.workspace = true
ps5-dump-forge-zstd.workspace = true

[target.'cfg(any(target_env = "ps5", target_env = "musl"))'.dependencies]
ps5-dump-forge-ps5.workspace = true

[lints.rust]
# `ps5/x86_64-ps5-freebsd.json` sets `env: ps5` (ps5/README.md).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_env, values("ps5"))'] }
