[package]
name = "ps5-dump-forge-gui"
description = "PS5 game image converter (GUI)"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true

[[bin]]
name = "Forge"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
dunce = "1.0.5"
ps5-dump-forge-core.workspace = true
# Connect (FLINK, discovery, saved NAS devices): the service only, never its HTTP server.
# ponytail: the crate's build script also embeds the web bundle; nothing here references it,
# so the linker drops it.
ps5-dump-forge-server.workspace = true
# Install on PS5 and Send a payload: an ELF streamed to the console's elfldr.
ps5-dump-forge-updater.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }

# The WebView2 runtime check before any window (main.rs); already in tauri's tree on Windows.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
