name: Build Static CLI (musl)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-musl:
    name: Build static CLI (x86_64-unknown-linux-musl)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install Cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build CLI static binary
        run: cross build --release --target x86_64-unknown-linux-musl -p ps5-dump-forge-cli

      - name: Package binary
        run: |
          cd target/x86_64-unknown-linux-musl/release
          tar -czvf ps5-dump-forge-cli-linux-x86_64-musl.tar.gz ps5-dump-forge
          mv ps5-dump-forge-cli-linux-x86_64-musl.tar.gz ../../../

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps5-dump-forge-cli-linux-x86_64-musl
          path: ps5-dump-forge-cli-linux-x86_64-musl.tar.gz

      - name: Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ps5-dump-forge-cli-linux-x86_64-musl.tar.gz
