name: Release

# A `v*` tag builds the macOS, Windows, Linux and PS5 releases and creates a *draft* GitHub Release
# of single files, no archives: per desktop platform and arch (macOS, Windows and Linux; arm64 and
# x86-64) the app (a .dmg, an .exe, an .AppImage) and the bare ps5-dump-forge CLI (on Linux static,
# musl), the PS5 payload (one plain .elf), SHA256SUMS, payloads.json (the payload's catalog for
# ps5-payload-manager); the licences are in the source (GitHub's own archive of the tag); publishing the draft is a manual step on GitHub, after checking its assets.
# `workflow_dispatch` is a dry run, even on a tag: same build, artifact kept on the run,
# nothing published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    # Per arch (arm64, x86-64; one run builds both): a .dmg of PS5 Dump Forge.app (no CLI inside)
    # and the bare CLI, ad-hoc signed. The x86-64 CLI's smoke run goes through Rosetta.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the versions agree (and match the tag)
        run: scripts/check-versions.sh
      - name: The pinned Rust (rust-toolchain.toml; it adds aarch64-apple-darwin and x86_64-apple-darwin)
        run: |
          rustup toolchain install --no-self-update
          rustc -Vv
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      # Without Rosetta the script skips the x86-64 CLI's run (with a note); make sure it is there.
      - name: Rosetta (the x86-64 CLI's smoke run)
        run: arch -x86_64 /usr/bin/true 2>/dev/null || softwareupdate --install-rosetta --agree-to-license
      # The web UI, then PS5 Dump Forge.app (tauri build) and the CLI for each arch; writes and checks
      # (mounted read-only) the two .dmg and the two bare CLIs, and a SHA256SUMS, into dist/.
      - run: scripts/release-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: |
            dist/*.dmg
            dist/ps5-dump-forge-cli-*-macos-*
          if-no-files-found: error
          retention-days: 3

  windows:
    # The app (PS5 Dump Forge.exe, renamed) and the CLI as two bare .exe per arch (MSVC, built
    # natively on each runner), unsigned; the app uses the installed (Evergreen) WebView2 Runtime.
    name: windows (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x86-64
          - os: windows-11-arm
            arch: arm64
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      # LF checkout: the runner's Git converts to CRLF, which breaks the bash scripts.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the versions agree (and match the tag)
        run: scripts/check-versions.sh
      - name: The pinned Rust (rust-toolchain.toml; the host, x86_64 or aarch64 pc-windows-msvc, is the release target)
        run: |
          rustup toolchain install --no-self-update
          rustc -Vv
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      # Builds PS5 Dump Forge.exe (tauri build --no-bundle), the web UI and the CLI, copies both exes
      # into dist/ under their asset names and checks the copies (PE machine, no VC++ DLL, CLI run).
      - run: scripts/release-windows.sh
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 3

  linux:
    # The AppImage itself, unsigned, one per arch, built natively on each runner (the CLI is
    # linux-musl's). ubuntu-22.04, not -latest: the app needs the build host's glibc (2.35) or newer.
    name: linux (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86-64
          - os: ubuntu-22.04-arm
            arch: arm64
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the versions agree (and match the tag)
        run: scripts/check-versions.sh
      # Tauri v2's Linux build deps; xvfb for the script's GUI launch check.
      - name: WebKitGTK and the AppImage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libayatana-appindicator3-dev patchelf file xvfb
      - name: The pinned Rust (rust-toolchain.toml; the host, x86_64 or aarch64 unknown-linux-gnu, is the release target)
        run: |
          rustup toolchain install --no-self-update
          rustc -Vv
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      # Builds the AppImage (tauri build), checks it (extracted: AppRun and the app binary; a 10 s
      # GUI launch under Xvfb) and copies it into dist/.
      - run: scripts/release-linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 3

  linux-musl:
    # The CLI alone, static (x86-64 and arm64 musl; PR #57: a NAS, Alpine, an old glibc), the web UI
    # embedded for `serve`. Built in the pinned Rust's Alpine image (scripts/release-linux-musl.sh),
    # natively on each runner (the image is multi-arch).
    name: linux-musl (${{ matrix.arch }} CLI)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86-64
          - os: ubuntu-22.04-arm
            arch: arm64
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the versions agree (and match the tag)
        run: scripts/check-versions.sh
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      # The web UI, then the static CLI in rust:1.100.0-alpine (by digest); checks that it has no
      # NEEDED libraries, starts and embeds the web UI, and writes the stripped
      # dist/ps5-dump-forge-cli-<v>-linux-<arch>.
      - run: scripts/release-linux-musl.sh
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-musl-${{ matrix.arch }}
          path: dist/ps5-dump-forge-cli-*-linux-*
          if-no-files-found: error
          retention-days: 3

  ps5:
    # The CLI as a PS5 payload with the web UI embedded, one plain .elf, unsigned. Cross-built in
    # the ps5/ Docker image (Rust build-std + the ps5-payload-dev SDK); the web UI on the runner.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the versions agree (and match the tag)
        run: scripts/check-versions.sh
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      # Builds the web UI and the ELF (ps5/build.sh), copies it into dist/ and checks the copy
      # (llvm-readelf: a PIE with the SDK's NEEDED modules; the web UI and version embedded).
      - run: scripts/release-ps5.sh
      - uses: actions/upload-artifact@v7
        with:
          name: release-ps5
          path: dist/*.elf
          if-no-files-found: error
          retention-days: 3

  publish:
    # One array entry per platform job (the windows and linux matrix legs all upload release-* artifacts).
    needs: [macos, windows, linux, linux-musl, ps5]
    # Only a real tag push creates the draft; a workflow_dispatch run stays a dry run.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      # The checkout is for scripts/make-payloads-json.sh and Cargo.toml's version.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Every platform job uploads a `release-*` artifact; merge them all into dist/.
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Recompute SHA256SUMS over every platform's files
        run: |
          cd dist
          rm -f SHA256SUMS
          # merge-multiple lets a mislabelled leg overwrite another's file, or a leg go missing:
          # require exactly the thirteen binaries of this tag before checksumming.
          ver=${GITHUB_REF_NAME#v}
          {
            for a in arm64 x86-64; do
              echo "ps5-dump-forge-$ver-macos-$a.dmg"
              echo "ps5-dump-forge-cli-$ver-macos-$a"
              echo "ps5-dump-forge-$ver-windows-$a.exe"
              echo "ps5-dump-forge-cli-$ver-windows-$a.exe"
              echo "ps5-dump-forge-$ver-linux-$a.AppImage"
              echo "ps5-dump-forge-cli-$ver-linux-$a"
            done
            echo "ps5-dump-forge-$ver-ps5.elf"
          } | LC_ALL=C sort > ../expected.txt
          printf '%s\n' * | LC_ALL=C sort | diff ../expected.txt - || { echo "::error::dist/ does not hold exactly the expected files"; exit 1; }
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      # The catalog for ps5-payload-manager: this release's .elf and its SHA-256. It is written
      # after SHA256SUMS and the check above, so neither lists it (it is not a binary).
      - name: Write payloads.json
        run: scripts/make-payloads-json.sh "dist/ps5-dump-forge-${GITHUB_REF_NAME#v}-ps5.elf" dist/payloads.json
      # gh is preinstalled on the runner; no third-party release action needed.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ver=${GITHUB_REF_NAME#v}
          {
            echo "Every download is one file, no archive: the app, or the ps5-dump-forge command-line tool (ps5-dump-forge-cli-...; it also runs the web UI with \`serve\`). Pick your system and arch (arm64 or x86-64)."
            echo
            echo "macOS 11 or later: open the macos-arm64 (Apple Silicon) or macos-x86-64 (Intel) .dmg and drag PS5 Dump Forge to Applications. It is ad-hoc signed only (not notarized): on the first launch macOS refuses it; open System Settings > Privacy & Security and choose \"Open Anyway\". The CLI: chmod +x it first (the same Open Anyway step applies)."
            echo
            echo "Windows 10 or 11: run the .exe (it uses the Microsoft Edge WebView2 Runtime, which Windows 11 and most Windows 10 PCs already have). Keep it in a folder you can write to (the app keeps its WebView data beside it). It is not signed, so SmartScreen may stop the first launch: choose \"More info\", then \"Run anyway\"."
            echo
            echo "Linux (glibc 2.35 or later, e.g. Ubuntu 22.04 or newer): chmod +x the .AppImage and run it (no install; it keeps its WebView data in data/ beside it). Without FUSE 2 (libfuse2), run it with --appimage-extract-and-run. The Linux CLI is static (musl): a NAS, Alpine or an older glibc too; chmod +x it first."
            echo
            echo "Update the CLI in place with \`ps5-dump-forge update --install\` (checked against SHA256SUMS); the app tells you when a release is out."
            echo
            echo "PS5 (jailbroken, with an ELF loader): load ps5-dump-forge-$ver-ps5.elf, e.g. send it to elfldr's port 9021 or list it in the webkit autoloader's autoload.txt, then open http://<ps5-ip>:8095 in a browser."
            echo "The web UI has no access control: use it on a trusted network."
            echo "ps5-payload-manager: add https://github.com/$GITHUB_REPOSITORY/releases/latest/download/payloads.json as a custom repository to install and update the payload there (payloads.json carries the .elf's SHA-256)."
            echo
            echo "SHA256SUMS lists every app, CLI and .elf. README, LICENSE (GPL-3.0), the UnRAR license and THIRD-PARTY-NOTICES.md are in the source archives below, the complete corresponding source of this release."
            case "$GITHUB_REF_NAME" in *-*)
              echo
              echo "Test release: not every format has been tested on a console yet. Keep the original dump." ;;
            esac
          } > notes.md
          # A tag with a suffix (v0.0.1-pre) becomes a pre-release.
          pre=; case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --draft $pre \
            --verify-tag --title "PS5 Dump Forge $GITHUB_REF_NAME" --notes-file notes.md
